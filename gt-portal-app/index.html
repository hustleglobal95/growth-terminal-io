<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <!-- The theme is written onto the document before the bundle is even fetched.
       Doing it in React is too late: the browser has already painted the light
       stylesheet, so the attribute lands a moment afterwards and the whole app
       flips white to dark in front of somebody who chose dark. Four lines here
       cost nothing and remove the flash entirely. The key matches lib/theme.ts.
       The theme-color meta is moved with it so the mobile browser chrome above
       the page matches the page. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('gt.theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#0E0E0D');
        }
      } catch (e) { /* private mode, stay light */ }
    })();
  </script>
  <!-- This is the signed in application. Its public face is a login screen,
       which is thin content on a brand subdomain. Indexing it splits brand
       signals with growthterminal.io and competes for branded searches.
       See RULES.md at the repository root. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Growth Terminal</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- JetBrains Mono was referenced by the mono token but never loaded, so every
       label and figure had been falling back to whatever monospace the operating
       system happened to have. One request fixes the whole interface. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
